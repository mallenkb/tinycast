name: Release
run-name: Tinycast ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching project.yml, for example 0.1.4
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mallenkb/tinycast' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release prerequisites
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          SOURCE_VERSION="$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' project.yml)"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::Version must match project.yml ($SOURCE_VERSION)."
            exit 1
          fi
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Configure SIGNING_P12_BASE64 and SIGNING_P12_PASSWORD with the existing release identity."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi
          xcodebuild -version | head -1 | grep -Eq '^Xcode 27\.'
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
      - name: Validate sources
        run: |
          set -euo pipefail
          ./Scripts/lint.sh
          for harness in dictionary-test icon-cache-test settings-file-test settings-backup-test; do
            ./Scripts/run-tests.sh "$harness"
          done
      - name: Import existing signing identity
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/tinycast-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/tinycast-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/tinycast-signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/tinycast-signing.p12"
      - name: Package signed universal app
        run: |
          set -euo pipefail
          export DEVELOPER_DIR
          DEVELOPER_DIR="$(xcode-select -p)"
          ./Scripts/build-dmg.sh "$VERSION" > "$RUNNER_TEMP/package.log" 2>&1
          APP="build/DerivedData/Build/Products/Release/Tinycast.app"
          ./Scripts/verify-signature.sh "$APP"
          for binary in "$APP/Contents/MacOS/Tinycast" \
            "$APP/Contents/Helpers/ClipboardTextHelper" \
            "$APP/Contents/Helpers/FileIndexHelper" \
            "$APP/Contents/Helpers/Tinycast Dictation.app/Contents/MacOS/Tinycast Dictation"; do
            lipo -verify_arch arm64 x86_64 "$binary"
          done
          hdiutil verify "build/Tinycast-Universal-$VERSION.dmg"
          unzip -tq "build/Tinycast-Universal-$VERSION.zip"
          cd build
          shasum -a 256 "Tinycast-Universal-$VERSION.dmg" "Tinycast-Universal-$VERSION.zip" > SHA256SUMS.txt
      - name: Publish fork release
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          <!-- tinycast:install -->
          ## Install

          Download the universal DMG and drag Tinycast to Applications. The ZIP supports the in-app updater. Checksums are included in SHA256SUMS.txt.

          This fork uses a self-signed certificate and is not notarized. If macOS blocks opening the installed app, run:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Tinycast.app"
          open "/Applications/Tinycast.app"
          ```

          Based on Tinycast by Abue Ammar. Original author credit, AGPL-3.0-or-later licensing, and third-party notices are preserved.
          NOTES
          gh release create "v$VERSION" \
            "build/Tinycast-Universal-$VERSION.dmg" \
            "build/Tinycast-Universal-$VERSION.zip" build/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Tinycast v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --draft
          gh release edit "v$VERSION" --draft=false --latest
      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-log
          path: ${{ runner.temp }}/package.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/tinycast-signing.p12"
          if [ -f "$RUNNER_TEMP/tinycast-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/tinycast-signing.keychain-db"
          fi
